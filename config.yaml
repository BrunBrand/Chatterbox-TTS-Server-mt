server:
  host: 0.0.0.0
  port: 8004
  use_ngrok: false
  use_auth: false
  auth_username: user
  auth_password: password
  log_file_path: logs/tts_server.log
  log_file_max_size_mb: 10
  log_file_backup_count: 5
model:
  repo_id: chatterbox-multilingual
tts_engine:
  device: cuda
  predefined_voices_path: voices
  reference_audio_path: reference_audio
  default_voice_id: Emily.wav
paths:
  model_cache: model_cache
  output: outputs
generation_defaults:
  temperature: 0.8
  exaggeration: 1.3
  cfg_weight: 0.5
  repetition_penalty: 1.8
  top_p: 0.9
  min_p: 0.1
  seed: 0
  speed_factor: 1.0
  language: en
audio_output:
  format: wav
  sample_rate: 24000
  max_reference_duration_sec: 30
  save_to_disk: false
ui_state:
  last_text: "E a\xED a m\xEDdia esquerdista vai falar de \"imperialismo\" e defender\
    \ o ditador. S\xE3o os mesmos que ficaram calados diante da fome e das mortes\
    \ provocadas pelo chavismo. Para essa turma, a democracia s\xF3 serve quando \xE9\
    \ para os amigos deles. *Falar com entusiasmo*"
  last_voice_mode: clone
  last_predefined_voice: Ian.wav
  last_reference_file: mark2.mp3
  last_seed: 0
  last_chunk_size: 320
  last_split_text_enabled: true
  last_temperature: 1.25
  last_exaggeration: 1.81
  last_cfg_weight: 0.74
  last_repetition_penalty: 1.45
  last_top_p: 0.43
  last_min_p: 0.32
  last_speed_factor: 1
  hide_chunk_warning: false
  hide_generation_warning: true
  theme: dark
  last_language: pt
  last_preset_name: "\u26A1 Turbo: The Emotional Movie Reviewer"
ui:
  title: Chatterbox TTS Server
  show_language_select: true
  max_predefined_voices_in_dropdown: 50
debug:
  save_intermediate_audio: false
